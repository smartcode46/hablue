blueprint:
  name: Light color cycle and restore previous state
  description: Snapshot a light, run a color cycle, optionally raise brightness during the alert, then restore the previous state.
  domain: automation

  input:
    trigger_entity:
      name: Trigger entity
      selector:
        entity: {}

    trigger_to_state:
      name: Trigger state
      default: "on"
      selector:
        text: {}

    target_light:
      name: Light to flash
      selector:
        entity:
          filter:
            - domain: light

    repeat_count:
      name: Number of cycles
      default: 5
      selector:
        number:
          min: 1
          max: 20
          step: 1
          mode: slider

    min_brightness_pct:
      name: Minimum brightness during alert
      default: 40
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"

    step_delay:
      name: Delay between colors
      default:
        hours: 0
        minutes: 0
        seconds: 0
        milliseconds: 500
      selector:
        duration: {}

mode: restart

trigger:
  - platform: state
    entity_id: !input trigger_entity
    to: !input trigger_to_state

variables:
  light_entity: !input target_light
  min_brightness_pct: !input min_brightness_pct

action:
  - service: scene.create
    data:
      scene_id: before_light_color_cycle_restore
      snapshot_entities:
        - !input target_light

  - repeat:
      count: !input repeat_count
      sequence:
        - service: light.turn_on
          target:
            entity_id: !input target_light
          data:
            rgb_color: [0, 255, 0]
            brightness_pct: >
              {{ [
                ((state_attr(light_entity, 'brightness') | int(0)) / 255 * 100),
                min_brightness_pct
              ] | max | round(0) }}

        - delay: !input step_delay

        - service: light.turn_on
          target:
            entity_id: !input target_light
          data:
            rgb_color: [255, 180, 0]
            brightness_pct: >
              {{ [
                ((state_attr(light_entity, 'brightness') | int(0)) / 255 * 100),
                min_brightness_pct
              ] | max | round(0) }}

        - delay: !input step_delay

        - service: light.turn_on
          target:
            entity_id: !input target_light
          data:
            rgb_color: [0, 120, 255]
            brightness_pct: >
              {{ [
                ((state_attr(light_entity, 'brightness') | int(0)) / 255 * 100),
                min_brightness_pct
              ] | max | round(0) }}

        - delay: !input step_delay

  - service: scene.turn_on
    target:
      entity_id: scene.before_light_color_cycle_restore
