blueprint:
  name: Washing machine done light flash cycle
  description: >
    Snapshot a light, turn it on if needed, run a 25-step color flash cycle,
    then restore the previous state.
  domain: automation

  input:
    trigger_entity:
      name: Trigger entity
      selector:
        entity: {}

    trigger_to_state:
      name: Trigger state
      default: "on"
      selector:
        text: {}

    target_light:
      name: Light to flash
      selector:
        entity:
          filter:
            - domain: light

    step_delay:
      name: Delay between flashes
      default:
        hours: 0
        minutes: 0
        seconds: 0
        milliseconds: 250
      selector:
        duration: {}

mode: restart

trigger:
  - platform: state
    entity_id: !input trigger_entity
    to: !input trigger_to_state

action:
  - service: scene.create
    data:
      scene_id: before_washing_machine_light_flash
      snapshot_entities:
        - !input target_light

  - service: light.turn_on
    target:
      entity_id: !input target_light
    data:
      rgb_color: [255, 255, 255]
      brightness_pct: 80
  - delay: !input step_delay

  - service: light.turn_on
    target:
      entity_id: !input target_light
    data:
      rgb_color: [255, 0, 0]
      brightness_pct: 50
  - delay: !input step_delay

  - service: light.turn_on
    target:
      entity_id: !input target_light
    data:
      rgb_color: [255, 128, 0]
      brightness_pct: 50
  - delay: !input step_delay

  - service: light.turn_on
    target:
      entity_id: !input target_light
    data:
      rgb_color: [255, 255, 0]
      brightness_pct: 50
  - delay: !input step_delay

  - service: light.turn_on
    target:
      entity_id: !input target_light
    data:
      rgb_color: [0, 120, 255]
      brightness_pct: 50
  - delay: !input step_delay

  - service: light.turn_on
    target:
      entity_id: !input target_light
    data:
      rgb_color: [0, 255, 0]
      brightness_pct: 100
  - delay: !input step_delay

  - service: light.turn_on
    target:
      entity_id: !input target_light
    data:
      rgb_color: [128, 0, 255]
      brightness_pct: 50
  - delay: !input step_delay

  - service: light.turn_on
    target:
      entity_id: !input target_light
    data:
      rgb_color: [255, 0, 180]
      brightness_pct: 50
  - delay: !input step_delay

  - service: light.turn_on
    target:
      entity_id: !input target_light
    data:
      rgb_color: [0, 255, 255]
      brightness_pct: 50
  - delay: !input step_delay

  - service: light.turn_on
    target:
      entity_id: !input target_light
    data:
      rgb_color: [255, 0, 255]
      brightness_pct: 50
  - delay: !input step_delay

  - service: light.turn_on
    target:
      entity_id: !input target_light
    data:
      rgb_color: [255, 255, 255]
      brightness_pct: 80
  - delay: !input step_delay

  - service: light.turn_on
    target:
      entity_id: !input target_light
    data:
      rgb_color: [255, 0, 0]
      brightness_pct: 50
  - delay: !input step_delay

  - service: light.turn_on
    target:
      entity_id: !input target_light
    data:
      rgb_color: [255, 128, 0]
      brightness_pct: 50
  - delay: !input step_delay

  - service: light.turn_on
    target:
      entity_id: !input target_light
    data:
      rgb_color: [255, 255, 0]
      brightness_pct: 50
  - delay: !input step_delay

  - service: light.turn_on
    target:
      entity_id: !input target_light
    data:
      rgb_color: [0, 120, 255]
      brightness_pct: 50
  - delay: !input step_delay

  - service: light.turn_on
    target:
      entity_id: !input target_light
    data:
