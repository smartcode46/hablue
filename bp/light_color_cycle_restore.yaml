      entity_id: !input target_light
    data:
      rgb_color: [255, 0, 255]
      brightness_pct: 50
  - delay: !input step_delay

  - service: light.turn_on
    target:
      entity_id: !input target_light
    data:
      rgb_color: [255, 255, 255]
      brightness_pct: 80
  - delay: !input step_delay

  - service: light.turn_on
    target:
      entity_id: !input target_light
    data:
      rgb_color: [255, 0, 0]
      brightness_pct: 50
  - delay: !input step_delay

